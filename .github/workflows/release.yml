name: Release

on:
  workflow_dispatch:
jobs:
  Release:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      DOTNET_INSTALL_DIR: "D:/tools/dotnet"
      DOTNET_ROOT: "D:/tools/dotnet"
      NUGET_PACKAGES: "D:/.nuget/packages"
    steps:
      - name: Cache dotnet
        id: cache-dotnet
        uses: actions/cache@v6
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ runner.os }}-10.0.404
          
      - name: Install dotnet
        if: ${{ steps.cache-dotnet.outputs.cache-hit != 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404

      - name: Set installed/cached dotnet path [${{ env.DOTNET_INSTALL_DIR }}]
        run: echo "${{ env.DOTNET_INSTALL_DIR }}" | Out-File -FilePath $ENV:GITHUB_PATH -Encoding utf8 -Append
                  
      - name: Checkout
        uses: actions/checkout@v7      
      
      - name: Cache NuGet packages      
        id: cache-nuget
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          
      - name: Install dependencies
        run: dotnet restore --locked-mode
      
      - name: Get next version
        id: get_version
        shell: pwsh
        env:
          INPUT_FALLBACK: "1.0.0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $owner, $repo = $env:GITHUB_REPOSITORY -split '/'
          $query = 'query($owner: String!, $name: String!, $refPrefix: String!) { repository(owner: $owner, name: $name) { refs(refPrefix: $refPrefix, first: 1, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) { nodes { name } } } }'
          $previousTag = gh api graphql -f query=$query -F owner=$owner -F name=$repo -F refPrefix=refs/tags/ --jq '.data.repository.refs.nodes[].name'
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to fetch latest tag via gh api" -ForegroundColor Red
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
              Write-Host "No tag was found. Falling back to: $env:INPUT_FALLBACK" -ForegroundColor Yellow
              $previousTag = $env:INPUT_FALLBACK
          }

          $match = [regex]::Match($previousTag, '^(\d+)\.(\d+)\.\d+$')
          if (-not $match.Success) {
              Write-Host "Unsupported tag format: $previousTag" -ForegroundColor Red
              exit 1
          }

          $version = "$($match.Groups[1].Value).$([int]$match.Groups[2].Value + 1).0"
          Write-Host "Previous tag: $previousTag, next minor version: $version" -ForegroundColor Green
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Get changelog
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $changelog = (Invoke-WebRequest -Uri "https://gist.githubusercontent.com/vinaghost/f7ce5204670e8194eea71a3961405c2f/raw/" -UseBasicParsing).Content.Trim()
          $delimiter = "CHANGELOG_BODY_EOF_$([guid]::NewGuid().ToString('N'))"
          "changelog<<$delimiter`n$changelog`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish
        run: dotnet publish WPFUI -c Release --no-restore --self-contained -p:PublishSingleFile=true -p:AssemblyVersion=${{ steps.get_version.outputs.version }}

      - name: Archive release
        shell: pwsh
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $name = "TBS-$env:VERSION"
          $staging = Join-Path $env:RUNNER_TEMP $name
          Copy-Item -Path "WPFUI\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish" -Destination $staging -Recurse
          Compress-Archive -Path $staging -DestinationPath "$name.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          $ErrorActionPreference = "Stop"

          $name = "TBS-$env:VERSION"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          Please join our Discord server for more information: [https://discord.gg/mBa4f2K](https://discord.gg/mBa4f2K)

          **Changelog**:
          $env:CHANGELOG
          "@ | Set-Content -Path $notesFile -Encoding utf8

          gh release create $env:VERSION "$name.zip" --title $name --target main --notes-file $notesFile

      - name: Notify Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BOT }}
          VERSION: ${{ steps.get_version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          $description = @"
          Version ``TBS-$env:VERSION``
          Click [here](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:VERSION) to download!

          **Changelog**:
          $env:CHANGELOG
          "@

          $payload = @{
            content = "@everyone"
            embeds  = @(
              @{
                title       = "New release"
                description = $description
                color       = 3066993
              }
            )
          } | ConvertTo-Json -Depth 4

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType "application/json; charset=utf-8" -Body $payload
